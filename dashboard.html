<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project dashboard – Make-It-All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Main"></nav>
  <main>
    <!-- R02: Manager's dashboard -->
    <header class="page-head">
      <div>
        <h1 id="greeting">Projects you manage</h1>
        <p class="lede">Progress against plan for each project you're responsible for. The black line on each bar shows where the plan says you should be today.</p>
      </div>
    </header>
    <div id="summary" class="summary" aria-label="Summary"></div>
    <div class="filters">
      <label>Show
        <select id="filter">
          <option value="all">All projects</option>
          <option value="attention">Needs attention</option>
        </select>
      </label>
      <label>Sort by
        <select id="sort">
          <option value="status">Most at risk first</option>
          <option value="deadline">Nearest deadline</option>
          <option value="progress">Furthest behind plan</option>
        </select>
      </label>
    </div>
    <div id="project-list" class="project-list" aria-live="polite"></div>
  </main>
</div>
<!-- Load order matters: data, then backend, then helpers, then the page. -->
<script src="js/mockData.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
